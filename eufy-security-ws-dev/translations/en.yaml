configuration:
  username:
    name: Username
    description: Eufy cloud account username (e-mail)
  password:
    name: Password
    description: Eufy cloud account password
  country:
    name: Country
    description: Eufy cloud account country
  accept_invitations:
    name: Accept invitations
    description: Accept automatically a received invitation
  polling_interval:
    name: Cloud polling interval
    description: Cloud polling interval in minutes
  event_duration:
    name: Event duration
    description: Device event duration in seconds (event reset time)
  debug:
    name: Debug
    description: Enable debug mode
  port:
    name: Port
    description: Listening port (host)
  stations:
    name: Stations
    description: Suggested IP addresses or broadcast addresses for stations
  ipv4first:
    name: Force IPv4 addresses first
    description: Forces the dns result order on Node.js to return IPv4 addresses first
  github_url:
    name: Github url
    description: Github repo link, should be https
  github_branch:
    name: Github branch
    description: Github repo branch name
  eufy_ws_github_url:
    name: Eufy WS Github url
    description: Github repo link for a development eufy-security-ws build
  eufy_ws_github_branch:
    name: Eufy WS Github branch
    description: Github repo branch name for a development eufy-security-ws build
  eufy_ws_version:
    name: Eufy WS Version
    description: Version of Eufy WS package to install when no websocket Github repo is configured
